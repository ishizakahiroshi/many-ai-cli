[package]
name = "many-ai-cli"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT"
description = "Compatibility migration candidate for many-ai-cli"
build = "build.rs"

[lib]
name = "many_ai_cli"
path = "src/lib.rs"

[[bin]]
name = "many-ai-cli"
path = "src/bin/many-ai-cli.rs"

[[bin]]
name = "many-ai-cli-launcher"
path = "src/bin/many-ai-cli-launcher.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
base64 = "=0.22.1"
getrandom = "=0.4.3"
url = "=2.5.8"
serde-saphyr = "=1.3.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
