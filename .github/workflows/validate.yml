name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      # develop への直 push でも品質ゲートを通す。develop は PR を経由せず
      # 直接コミットが積まれる運用のため、main だけを対象にしていると
      # タグ付け直前まで一度も CI が走らない (v0.5.2 リリース時に発覚)。
      - develop

permissions:
  contents: read

jobs:
  go-check:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Build frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Verify modules
        run: go mod verify

  # 調査用に仕込んだ観測コードがリリースへ紛れ込むのを止める。
  # 同型の事故が v0.5.1（/api/debug/batch-log）・v0.5.x（入力トレース・監査 A-01）・
  # v0.6.0（/api/debug/ui-log と ui_input_trace）と 3 回起きているので、
  # 「原因が確定したら消す」とコメントに書くだけの運用を機械検査に置き換える。
  instrumentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check instrumentation ledger
        run: node scripts/check-instrumentation.mjs

  go-mod-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go mod tidy
        run: go mod tidy

      - name: Verify tidy output
        run: git diff --exit-code -- go.mod go.sum

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Build frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Run govulncheck
        # C1 (plan_audit_score_s_promotion_2026-07-05.md): supply-chain 防御として
        # @latest を避け固定タグを使う。定期的に手動更新する。
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.5.0 ./...

  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Build frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      # severity/confidence とも high のみゲートする。
      # G304/G204 等の by-design 検出（ファイルブラウザ・CLI ラッパーの性質上不可避）は
      # 低 severity に分類されるためここでは対象外。誤検知は #nosec G7xx -- 理由 で注記する。
      - name: Run gosec (high severity / high confidence)
        # C1: @latest → 固定タグ (2026-07-05 時点の最新安定版)
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.27.1 -quiet -severity high -confidence high ./...

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Build frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Run staticcheck
        # C1: @latest → 固定タグ (2026-07-05 時点の最新安定版)
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

  web-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck frontend
        run: bun run check

      - name: Build frontend
        run: bun run build

      - name: Test frontend fixtures
        run: bun run test

  third-party:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check third-party notices
        shell: pwsh
        run: .\scripts\local\check-third-party.ps1

  web-package-manager-consistency:
    # C8 (plan_audit_score_s_promotion_2026-07-05.md): web/ は bun のみを使う運用。
    # bun.lock を frozen-lockfile で検証しつつ、PR で package-lock.json が更新されて
    # いたら warning を出して drift を検知する (削除は破壊変更のため強制はしない)。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Assert bun.lock matches package.json
        run: bun install --frozen-lockfile
      - name: Warn if package-lock.json is modified in this PR
        if: github.event_name == 'pull_request'
        working-directory: .
        shell: bash
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -q '^web/package-lock.json$'; then
            echo "::warning::web/package-lock.json was modified. web/ は bun のみを使う運用です (web/README.md 参照)。npm install で更新された可能性があります。"
          fi
