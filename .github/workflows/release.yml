# Same four native targets/helpers as rust-migration.yml, one build per target.
# All downstream channels consume signed canonical ZIPs. No Docker publication.
name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Rust release tag, e.g. v0.10.0'
        required: true
        type: string
      npm_only:
        description: 'Legacy mode: npm only from the existing Rust release'
        type: boolean
        default: true
      channel:
        description: 'legacy honors npm_only; full must run at the tag ref'
        type: choice
        default: legacy
        options: [legacy, full, npm, homebrew, winget]
permissions:
  contents: read
concurrency:
  group: rust-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      mode: ${{ steps.target.outputs.mode }}
      source_sha: ${{ steps.target.outputs.source_sha }}
      prerelease: ${{ steps.target.outputs.prerelease }}
    steps:
      # Every manual run, a channel rerun included, starts at the tag itself:
      # the scripts of the ref a run starts at receive the publishing
      # credential and npm's OIDC identity once the run is approved. The
      # `release` environment accepts only `v*` tags for the same reason, and
      # the plan step below checks the exact commit (audit N39).
      - name: Refuse a manual run that was not started at the release tag
        if: github.event_name == 'workflow_dispatch' && github.ref != format('refs/tags/{0}', inputs.tag)
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          echo "::error::start this workflow at the tag itself (Use workflow from: Tags, $RELEASE_TAG); it was started at $GITHUB_REF"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate exact tag source before any compile
        id: target
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          LEGACY_NPM_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_only && 'true' || 'false' }}
          CHANNEL: ${{ inputs.channel || 'legacy' }}
        run: >-
          python3 scripts/rust-release-workflow.py plan --event "$GITHUB_EVENT_NAME"
          --ref "$GITHUB_REF" --sha "$GITHUB_SHA" --tag "$RELEASE_TAG"
          --npm-only "$LEGACY_NPM_ONLY" --channel "$CHANNEL" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.target.outputs.mode == 'full'
        with:
          node-version: '22.23.5'
      - name: Refuse registered instrumentation before any native compile
        if: steps.target.outputs.mode == 'full'
        run: node scripts/check-instrumentation.mjs --release
      - name: Refuse rebuilding a published release; select a channel rerun
        if: steps.target.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 -c 'import json,os; pages=json.load(open(os.environ["RUNNER_TEMP"]+"/releases.json")); assert not any(x["tag_name"]==os.environ["RELEASE_TAG"] for page in pages for x in page), "release exists; select npm/homebrew/winget instead of rebuilding"'
      - name: Refuse empty or missing release notes before compiling
        if: steps.target.outputs.mode == 'full'
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: python3 scripts/rust-release-workflow.py notes --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release-notes.md"
      # Only push runs on this repository's release branches or the tag count;
      # a pull request anyone opens at the tag commit neither blocks nor masks.
      - name: Require green source validation and identity/secret scans
        if: steps.target.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: python3 scripts/rust-release-workflow.py check-source-ci --repository "$GITHUB_REPOSITORY" --source "$SOURCE_SHA" --tag "$RELEASE_TAG"

  native:
    name: Rust release (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    env:
      RUSTUP_TOOLCHAIN: '1.90.0'
      GOTOOLCHAIN: local
      MANY_AI_REVIEW_HEAD_SHA: ${{ needs.plan.outputs.source_sha }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Preserve source bytes on every native runner
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Pinned fixture-tool contract only; no Go product build or execution.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.5'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Install pinned Rust (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Install pinned Rust (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Validate and build one formal native target (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: python3 scripts/rust-candidate-ci.py --target '${{ matrix.target }}' --release-tag "$RELEASE_TAG"
      - name: Validate and build one formal native target (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/rust-candidate-ci.py --target '${{ matrix.target }}' --release-tag $env:RELEASE_TAG
      - name: Retain both native binaries and receipts for this attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-release-${{ matrix.target }}-${{ needs.plan.outputs.source_sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .rust-candidate-artifacts/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  package:
    needs: [plan, native]
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      # Digests of the exact payload, recorded before any SBOM tool runs. A
      # later job of this run can replace an artifact, not a job output (U41).
      payload_sums: ${{ steps.payload.outputs.sums }}
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.5'
      - name: Require four current native artifacts (partial reruns fail)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: >-
          python3 scripts/rust-release-workflow.py check-native-artifacts
          --repository "$GITHUB_REPOSITORY" --source "$SOURCE_SHA"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rust-release-{x86_64-pc-windows-msvc,x86_64-unknown-linux-gnu,x86_64-apple-darwin,aarch64-apple-darwin}-${{ needs.plan.outputs.source_sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .rust-release-inputs/
          merge-multiple: true
      - name: Assemble same-source formal ZIPs without rebuilding
        run: |
          set -euo pipefail
          python3 scripts/package-rust-candidates.py --inputs .rust-release-inputs --output .rust-release-bundle --release-tag "$RELEASE_TAG"
          mkdir .rust-release-linux
      - name: Prepare Linux packages and stable pointers from canonical ZIPs
        if: needs.plan.outputs.prerelease == 'false'
        run: >-
          python3 scripts/prepare-rust-release-channels.py --archives .rust-release-bundle
          --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --output .rust-release-channels
      - name: Build Linux package containers without native compilation
        if: needs.plan.outputs.prerelease == 'false'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y rpm cpio
          dpkg-deb --build --root-owner-group .rust-release-channels/deb-root ".rust-release-linux/many-ai-cli-${RELEASE_TAG#v}-linux-x64.deb"
          mkdir -p .rust-release-rpm-build/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          rpmbuild --define "_topdir $GITHUB_WORKSPACE/.rust-release-rpm-build" --define "_sourcedir $GITHUB_WORKSPACE/.rust-release-channels/rpm/SOURCES" -bb .rust-release-channels/rpm/SPECS/many-ai-cli.spec
          find .rust-release-rpm-build/RPMS -type f -name '*.rpm' -exec cp '{}' .rust-release-linux/ \;
          mkdir .rust-release-deb-readback .rust-release-rpm-readback
          dpkg-deb --extract .rust-release-linux/*.deb .rust-release-deb-readback
          rpm2cpio .rust-release-linux/*.rpm | (cd .rust-release-rpm-readback && cpio -idm --no-absolute-filenames)
          python3 scripts/rust-release-workflow.py verify-linux-payloads --expected .rust-release-channels/deb-root --deb .rust-release-deb-readback --rpm .rust-release-rpm-readback
      - name: Report prerelease package and stable pointer policy
        if: needs.plan.outputs.prerelease == 'true'
        run: echo '::notice::prerelease publishes four ZIPs and npm next; deb/rpm and Homebrew/winget are explicitly skipped'
      - name: Prepare exact distribution asset set
        run: python3 scripts/rust-release-workflow.py prepare-assets --bundle .rust-release-bundle --packages .rust-release-linux --output .rust-release-assets --tag "$RELEASE_TAG"
      - name: Block instrumentation before signing or publication
        run: |
          node scripts/check-instrumentation.mjs --release
          node scripts/check-artifact-clean.mjs .rust-release-bundle .rust-release-assets
          if [ -d .rust-release-channels ]; then node scripts/check-artifact-clean.mjs .rust-release-channels; fi
      # A check only. The publish job writes the notes it publishes itself,
      # from the tag's CHANGELOG: an artifact handed across the SBOM job could
      # be replaced there (audit N41).
      - name: Require human release notes
        run: python3 scripts/rust-release-workflow.py notes --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release-notes.md"
      - name: Record payload digests for the SBOM and signing jobs
        id: payload
        working-directory: .rust-release-assets
        run: |
          set -euo pipefail
          {
            echo 'sums<<PAYLOAD_SUMS_END'
            sha256sum -- *
            echo 'PAYLOAD_SUMS_END'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-release-payload-${{ needs.plan.outputs.source_sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .rust-release-assets/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Syft runs only here, away from the bytes that are signed: it reads the
  # payload and hands back SPDX documents, which assemble accepts only when
  # their roots bind to the digests the package job recorded (U41).
  sbom:
    needs: [plan, package]
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-release-payload-${{ needs.plan.outputs.source_sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .rust-release-assets/
      # The tarball's SHA-256 is pinned here (GitHub's digest of the v1.41.1
      # release asset); a replaced binary or installer stops before it runs.
      - name: Install Syft from its release tarball with a pinned SHA-256
        env:
          SYFT_VERSION: '1.41.1'
          SYFT_SHA256: d5ef5af2acebe7f6e60dda19a708fdf4d6f3f49f8d6b2d3e29265c1629f5d121
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --retry 3 --output "$archive" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/syft"
          tar -xzf "$archive" -C "$RUNNER_TEMP/syft" syft
          "$RUNNER_TEMP/syft/syft" version | grep -F "$SYFT_VERSION"
          echo "$RUNNER_TEMP/syft" >> "$GITHUB_PATH"
      - name: Generate distribution SPDX for each payload
        run: |
          set -euo pipefail
          mkdir .rust-release-sbom
          for asset in .rust-release-assets/*; do
            document=".rust-release-sbom/$(basename "$asset").spdx.json"
            syft scan "$asset" --output "spdx-json=$document"
            python3 scripts/rust-release-workflow.py complete-sbom --asset "$asset" --document "$document" --tag "$RELEASE_TAG"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-release-sbom-${{ needs.plan.outputs.source_sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .rust-release-sbom/
          # upload-artifact v4 skips a dot folder's contents unless told to.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Writes the checksum inventory from the payload the package job recorded.
  # No SBOM tool runs here, and an SPDX document is paired with its payload
  # only by exact name and only if its root binds to that payload's digest.
  assemble:
    needs: [plan, package, sbom]
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-release-payload-${{ needs.plan.outputs.source_sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .rust-release-assets/
      - name: Require the payload the package job recorded
        env:
          PAYLOAD_SUMS: ${{ needs.package.outputs.payload_sums }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PAYLOAD_SUMS" | sed '/^$/d' > "$RUNNER_TEMP/payload-sums.txt"
          python3 scripts/rust-release-workflow.py verify-payload --directory .rust-release-assets --sums "$RUNNER_TEMP/payload-sums.txt" --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-release-sbom-${{ needs.plan.outputs.source_sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .rust-release-sbom/
      - name: Pair each payload with its SPDX and write the checksum inventory
        run: |
          set -euo pipefail
          for asset in .rust-release-assets/*; do
            cp -- ".rust-release-sbom/$(basename "$asset").spdx.json" .rust-release-assets/
          done
          python3 scripts/rust-release-workflow.py checksums --directory .rust-release-assets --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-release-unsigned-${{ needs.plan.outputs.source_sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .rust-release-assets/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [plan, package, assemble]
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-release-unsigned-${{ needs.plan.outputs.source_sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .rust-release-assets/
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: 'v2.4.3'
      - name: Sign and verify immutable distribution checksums
        working-directory: .rust-release-assets
        env:
          PAYLOAD_SUMS: ${{ needs.package.outputs.payload_sums }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          # Each payload line must be the digest the package job recorded
          # before any SBOM tool ran (U41).
          printf '%s\n' "$PAYLOAD_SUMS" | sed '/^$/d' > "$RUNNER_TEMP/payload-sums.txt"
          test "$(grep -c . "$RUNNER_TEMP/payload-sums.txt")" -ge 4
          while IFS= read -r line; do
            grep -Fqx -- "$line" SHA256SUMS.txt || { echo "::error::signed checksums differ from the recorded payload: $line"; exit 1; }
          done < "$RUNNER_TEMP/payload-sums.txt"
          cosign sign-blob --yes --output-signature SHA256SUMS.txt.sig --output-certificate SHA256SUMS.txt.pem SHA256SUMS.txt
          cosign verify-blob --certificate SHA256SUMS.txt.pem --signature SHA256SUMS.txt.sig --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$RELEASE_TAG" --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-release-signed-${{ needs.plan.outputs.source_sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .rust-release-assets/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, sign]
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-release-signed-${{ needs.plan.outputs.source_sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .rust-release-assets/
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: 'v2.4.3'
      # The notes come from the CHANGELOG of the tag commit checked out above,
      # not from an artifact of an earlier job (audit N41).
      - name: Write the release notes from the tag source
        run: python3 scripts/rust-release-workflow.py notes --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release-notes.md"
      - name: Verify signed handoff before publication credential
        run: |
          set -euo pipefail
          cosign verify-blob --certificate .rust-release-assets/SHA256SUMS.txt.pem --signature .rust-release-assets/SHA256SUMS.txt.sig --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$RELEASE_TAG" --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' .rust-release-assets/SHA256SUMS.txt
          python3 scripts/rust-release-workflow.py verify-assets --directory .rust-release-assets --tag "$RELEASE_TAG"
          test -s "$RUNNER_TEMP/release-notes.md"
      - name: Publish canonical signed assets and human release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          options=()
          if [ "$PRERELEASE" = true ]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" .rust-release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${options[@]}"

  canonical:
    needs: [plan, publish]
    if: ${{ always() && needs.plan.result == 'success' && (needs.plan.outputs.mode != 'full' || needs.publish.result == 'success') }}
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      # Reruns use the tag commit's scripts, like the binaries (audit N39).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: 'v2.4.3'
      - name: Download four canonical ZIPs and signed checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir .canonical
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir .canonical --pattern '*-windows-x64.zip' --pattern '*-linux-x64.zip' --pattern '*-macos-intel.zip' --pattern '*-macos-apple-silicon.zip' --pattern SHA256SUMS.txt --pattern SHA256SUMS.txt.sig --pattern SHA256SUMS.txt.pem
      - name: Verify tag signature and every canonical archive hash
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          cosign verify-blob --certificate .canonical/SHA256SUMS.txt.pem --signature .canonical/SHA256SUMS.txt.sig --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$RELEASE_TAG" --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' .canonical/SHA256SUMS.txt
          python3 scripts/rust-release-workflow.py verify-archives --directory .canonical --tag "$RELEASE_TAG" --source "$SOURCE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-canonical-${{ needs.plan.outputs.tag }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .canonical/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  npm:
    needs: [plan, canonical]
    # npm accepts this job through Trusted Publishing: each of the five packages
    # trusts only this repository's release.yml in the `release` environment,
    # whose required reviewer approves before the job starts. No npm key is
    # stored anywhere. The job only stages; a version goes live when the owner
    # approves it on npmjs.com with 2FA (U36).
    environment: release
    if: ${{ always() && needs.canonical.result == 'success' && (needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'npm') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing and provenance; no dependency install/native build here
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
      - name: Pin package metadata, shim, README and staging scripts to the release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
          path: .release-tag
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Node 24.22.3 carries npm 11.19.1; staged publishing (npm stage publish)
      # needs npm 11.15.0 or later. The registry URL input stays unset, so setup-node writes no
      # .npmrc whose token placeholder npm could send instead of the exchanged
      # credential.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.3'
      - name: Require an npm that can stage through Trusted Publishing
        run: |
          set -euo pipefail
          version="$(npm --version)"
          echo "npm $version"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&b>=15)?0:1)' "$version" \
            || { echo "::error::npm $version cannot stage through Trusted Publishing (11.15.0 or later required)"; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-canonical-${{ needs.plan.outputs.tag }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .canonical/
      - name: Stage normal and npm-only runs from verified published archives
        env:
          PACKAGE_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 scripts/rust-release-workflow.py verify-archives --directory .canonical --tag "$RELEASE_TAG" --source "$PACKAGE_SOURCE_SHA"
          echo "npm package inputs and staging scripts=$PACKAGE_SOURCE_SHA"
          cd .release-tag
          node scripts/stage-npm-from-release.mjs ../.canonical
          node scripts/sync-npm-version.mjs "$RELEASE_TAG"
      - name: Stage platform packages before root (Trusted Publishing, no stored key; owner approves on npmjs.com)
        working-directory: .release-tag
        run: bash scripts/publish-npm.sh "$RELEASE_TAG"

  pointers:
    needs: [plan, canonical]
    # Same environment as npm, so one approval lets both go (U36).
    environment: release
    if: ${{ always() && needs.canonical.result == 'success' && (needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'homebrew' || needs.plan.outputs.mode == 'winget') }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        channel: [homebrew, winget]
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      MODE: ${{ needs.plan.outputs.mode }}
      CHANNEL: ${{ matrix.channel }}
      POINTER_AVAILABLE: ${{ secrets.PUBLISH_GITHUB_TOKEN != '' && 'true' || 'false' }}
      STABLE: ${{ needs.plan.outputs.prerelease == 'false' && 'true' || 'false' }}
    steps:
      - name: Report skipped optional or prerelease pointer
        if: env.POINTER_AVAILABLE != 'true' || env.STABLE != 'true' || (env.MODE != 'full' && env.MODE != env.CHANNEL)
        run: echo "::notice::$CHANNEL skipped (mode=$MODE, stable=$STABLE, credential configured=$POINTER_AVAILABLE)"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.POINTER_AVAILABLE == 'true' && env.STABLE == 'true' && (env.MODE == 'full' || env.MODE == env.CHANNEL)
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: env.POINTER_AVAILABLE == 'true' && env.STABLE == 'true' && (env.MODE == 'full' || env.MODE == env.CHANNEL)
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: env.POINTER_AVAILABLE == 'true' && env.STABLE == 'true' && (env.MODE == 'full' || env.MODE == env.CHANNEL)
        with:
          name: rust-canonical-${{ needs.plan.outputs.tag }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .canonical/
      - name: Prepare stable pointer manifests from canonical archives
        if: env.POINTER_AVAILABLE == 'true' && env.STABLE == 'true' && (env.MODE == 'full' || env.MODE == env.CHANNEL)
        run: >-
          python3 scripts/prepare-rust-release-channels.py --archives .canonical
          --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --output .pointer-inputs
      # The token lives only in this environment, so its scopes are checked
      # here; a job outside the environment reads it as empty and would skip
      # the check every time (audit N40). `repo` is needed to write the tap and
      # the fork. `workflow` is needed to sync the winget-pkgs fork, but only
      # when upstream changed a workflow file, so releases can pass for months
      # without it (v0.6.0, 2026-08-11); the sync itself only warns, so a
      # missing `workflow` is a warning here too.
      - name: Check the publishing token's scopes
        if: env.POINTER_AVAILABLE == 'true' && env.STABLE == 'true' && (env.MODE == 'full' || env.MODE == env.CHANNEL)
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          headers=$(gh api -i user 2>/dev/null | sed -n '1,/^\r*$/p')
          scopes=$(printf '%s' "$headers" | grep -i '^x-oauth-scopes:' | cut -d: -f2- | tr -d ' \r' || true)
          if [ -z "$scopes" ]; then
            echo "::warning title=token scopes not introspectable::PUBLISH_GITHUB_TOKEN returned no scope list (a fine-grained token does not). Check by hand that it can write the tap and the winget-pkgs fork."
            exit 0
          fi
          echo "scopes: $scopes"
          case ",$scopes," in
            *,repo,*) ;;
            *) echo "::error title=PUBLISH_GITHUB_TOKEN is missing the repo scope::current scopes: $scopes"; exit 1 ;;
          esac
          case ",$scopes," in
            *,workflow,*) echo "OK: repo and workflow" ;;
            *) echo "::warning title=PUBLISH_GITHUB_TOKEN is missing the workflow scope::The winget-pkgs fork cannot be synced when upstream changed a workflow file. Add the scope at https://github.com/settings/tokens and update the secret of the release environment. Current scopes: $scopes" ;;
          esac
      - name: Publish pointer (cross-repository PAT only here)
        if: env.POINTER_AVAILABLE == 'true' && env.STABLE == 'true' && (env.MODE == 'full' || env.MODE == env.CHANNEL)
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_GITHUB_TOKEN }}
        run: python3 scripts/rust-release-workflow.py publish-pointer --channel "$CHANNEL" --directory .pointer-inputs --tag "$RELEASE_TAG"
