# Same four native targets/helpers as rust-migration.yml, one build per target.
# All downstream channels consume signed canonical ZIPs. No Docker publication.
name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Rust release tag, e.g. v1.0.0'
        required: true
        type: string
      npm_only:
        description: 'Legacy mode: npm only from the existing Rust release'
        type: boolean
        default: true
      channel:
        description: 'legacy honors npm_only; full must run at the tag ref'
        type: choice
        default: legacy
        options: [legacy, full, npm, homebrew, winget]
permissions:
  contents: read
concurrency:
  group: rust-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      mode: ${{ steps.target.outputs.mode }}
      source_sha: ${{ steps.target.outputs.source_sha }}
      prerelease: ${{ steps.target.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate exact tag source before any compile
        id: target
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          LEGACY_NPM_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_only && 'true' || 'false' }}
          CHANNEL: ${{ inputs.channel || 'legacy' }}
        run: >-
          python3 scripts/rust-release-workflow.py plan --event "$GITHUB_EVENT_NAME"
          --ref "$GITHUB_REF" --sha "$GITHUB_SHA" --tag "$RELEASE_TAG"
          --npm-only "$LEGACY_NPM_ONLY" --channel "$CHANNEL" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.target.outputs.mode == 'full'
        with:
          node-version: '22.23.4'
      - name: Refuse registered instrumentation before any native compile
        if: steps.target.outputs.mode == 'full'
        run: node scripts/check-instrumentation.mjs --release
      - name: Refuse rebuilding a published release; select a channel rerun
        if: steps.target.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 -c 'import json,os; pages=json.load(open(os.environ["RUNNER_TEMP"]+"/releases.json")); assert not any(x["tag_name"]==os.environ["RELEASE_TAG"] for page in pages for x in page), "release exists; select npm/homebrew/winget instead of rebuilding"'
      - name: Refuse empty or missing release notes before compiling
        if: steps.target.outputs.mode == 'full'
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: python3 scripts/rust-release-workflow.py notes --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release-notes.md"
      - name: Require green source validation and identity/secret scans
        if: steps.target.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        run: python3 scripts/rust-release-workflow.py check-source-ci --repository "$GITHUB_REPOSITORY" --source "$SOURCE_SHA"

  native:
    name: Rust release (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    env:
      RUSTUP_TOOLCHAIN: '1.90.0'
      GOTOOLCHAIN: local
      MANY_AI_REVIEW_HEAD_SHA: ${{ needs.plan.outputs.source_sha }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Preserve source bytes on every native runner
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Pinned fixture-tool contract only; no Go product build or execution.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install pinned Rust (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Install pinned Rust (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Validate and build one formal native target (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: python3 scripts/rust-candidate-ci.py --target '${{ matrix.target }}' --release-tag "$RELEASE_TAG"
      - name: Validate and build one formal native target (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/rust-candidate-ci.py --target '${{ matrix.target }}' --release-tag $env:RELEASE_TAG
      - name: Retain both native binaries and receipts for this attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-release-${{ matrix.target }}-${{ needs.plan.outputs.source_sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .rust-candidate-artifacts/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  package:
    needs: [plan, native]
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - name: Require four current native artifacts (partial reruns fail)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: >-
          python3 scripts/rust-release-workflow.py check-native-artifacts
          --repository "$GITHUB_REPOSITORY" --source "$SOURCE_SHA"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rust-release-{x86_64-pc-windows-msvc,x86_64-unknown-linux-gnu,x86_64-apple-darwin,aarch64-apple-darwin}-${{ needs.plan.outputs.source_sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .rust-release-inputs/
          merge-multiple: true
      - name: Assemble same-source formal ZIPs without rebuilding
        run: |
          set -euo pipefail
          python3 scripts/package-rust-candidates.py --inputs .rust-release-inputs --output .rust-release-bundle --release-tag "$RELEASE_TAG"
          mkdir .rust-release-linux
      - name: Prepare Linux packages and stable pointers from canonical ZIPs
        if: needs.plan.outputs.prerelease == 'false'
        run: >-
          python3 scripts/prepare-rust-release-channels.py --archives .rust-release-bundle
          --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --output .rust-release-channels
      - name: Build Linux package containers without native compilation
        if: needs.plan.outputs.prerelease == 'false'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y rpm cpio
          dpkg-deb --build --root-owner-group .rust-release-channels/deb-root ".rust-release-linux/many-ai-cli-${RELEASE_TAG#v}-linux-x64.deb"
          mkdir -p .rust-release-rpm-build/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          rpmbuild --define "_topdir $GITHUB_WORKSPACE/.rust-release-rpm-build" --define "_sourcedir $GITHUB_WORKSPACE/.rust-release-channels/rpm/SOURCES" -bb .rust-release-channels/rpm/SPECS/many-ai-cli.spec
          find .rust-release-rpm-build/RPMS -type f -name '*.rpm' -exec cp '{}' .rust-release-linux/ \;
          mkdir .rust-release-deb-readback .rust-release-rpm-readback
          dpkg-deb --extract .rust-release-linux/*.deb .rust-release-deb-readback
          rpm2cpio .rust-release-linux/*.rpm | (cd .rust-release-rpm-readback && cpio -idm --no-absolute-filenames)
          python3 scripts/rust-release-workflow.py verify-linux-payloads --expected .rust-release-channels/deb-root --deb .rust-release-deb-readback --rpm .rust-release-rpm-readback
      - name: Report prerelease package and stable pointer policy
        if: needs.plan.outputs.prerelease == 'true'
        run: echo '::notice::prerelease publishes four ZIPs and npm next; deb/rpm and Homebrew/winget are explicitly skipped'
      - name: Prepare exact distribution asset set
        run: python3 scripts/rust-release-workflow.py prepare-assets --bundle .rust-release-bundle --packages .rust-release-linux --output .rust-release-assets --tag "$RELEASE_TAG"
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: 'v1.41.1'
      - name: Generate distribution SPDX and checksum inventory
        run: |
          set -euo pipefail
          for asset in .rust-release-assets/*; do
            syft scan "$asset" --output "spdx-json=$asset.spdx.json"
            python3 scripts/rust-release-workflow.py complete-sbom --asset "$asset" --document "$asset.spdx.json" --tag "$RELEASE_TAG"
          done
          python3 scripts/rust-release-workflow.py checksums --directory .rust-release-assets --tag "$RELEASE_TAG"
      - name: Block instrumentation before signing or publication
        run: |
          node scripts/check-instrumentation.mjs --release
          node scripts/check-artifact-clean.mjs .rust-release-bundle .rust-release-assets
          if [ -d .rust-release-channels ]; then node scripts/check-artifact-clean.mjs .rust-release-channels; fi
      - name: Require human release notes
        run: python3 scripts/rust-release-workflow.py notes --tag "$RELEASE_TAG" --output .rust-release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-release-unsigned-${{ needs.plan.outputs.source_sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .rust-release-assets/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-release-notes-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .rust-release-notes.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [plan, package]
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-release-unsigned-${{ needs.plan.outputs.source_sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .rust-release-assets/
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: 'v2.4.3'
      - name: Sign and verify immutable distribution checksums
        working-directory: .rust-release-assets
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          cosign sign-blob --yes --output-signature SHA256SUMS.txt.sig --output-certificate SHA256SUMS.txt.pem SHA256SUMS.txt
          cosign verify-blob --certificate SHA256SUMS.txt.pem --signature SHA256SUMS.txt.sig --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$RELEASE_TAG" --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-release-signed-${{ needs.plan.outputs.source_sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .rust-release-assets/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, sign]
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-release-signed-${{ needs.plan.outputs.source_sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .rust-release-assets/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-release-notes-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .release-notes/
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: 'v2.4.3'
      - name: Verify signed handoff before publication credential
        run: |
          set -euo pipefail
          cosign verify-blob --certificate .rust-release-assets/SHA256SUMS.txt.pem --signature .rust-release-assets/SHA256SUMS.txt.sig --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$RELEASE_TAG" --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' .rust-release-assets/SHA256SUMS.txt
          python3 scripts/rust-release-workflow.py verify-assets --directory .rust-release-assets --tag "$RELEASE_TAG"
          test -s .release-notes/.rust-release-notes.md
      - name: Publish canonical signed assets and human release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          options=()
          if [ "$PRERELEASE" = true ]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" .rust-release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes-file .release-notes/.rust-release-notes.md "${options[@]}"

  canonical:
    needs: [plan, publish]
    if: ${{ always() && needs.plan.result == 'success' && (needs.plan.outputs.mode != 'full' || needs.publish.result == 'success') }}
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      # Retries use selected ref's scripts; binaries always come from the tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: 'v2.4.3'
      - name: Download four canonical ZIPs and signed checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir .canonical
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir .canonical --pattern '*-windows-x64.zip' --pattern '*-linux-x64.zip' --pattern '*-macos-intel.zip' --pattern '*-macos-apple-silicon.zip' --pattern SHA256SUMS.txt --pattern SHA256SUMS.txt.sig --pattern SHA256SUMS.txt.pem
      - name: Verify tag signature and every canonical archive hash
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          cosign verify-blob --certificate .canonical/SHA256SUMS.txt.pem --signature .canonical/SHA256SUMS.txt.sig --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$RELEASE_TAG" --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' .canonical/SHA256SUMS.txt
          python3 scripts/rust-release-workflow.py verify-archives --directory .canonical --tag "$RELEASE_TAG" --source "$SOURCE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-canonical-${{ needs.plan.outputs.tag }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .canonical/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  npm:
    needs: [plan, canonical]
    if: ${{ always() && needs.canonical.result == 'success' && (needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'npm') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # npm provenance, no dependency install/native build here
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      NPM_AVAILABLE: ${{ secrets.NPM_TOKEN != '' && 'true' || 'false' }}
    steps:
      - name: Report optional npm channel unavailable
        if: env.NPM_AVAILABLE != 'true'
        run: echo '::notice::npm skipped because NPM_TOKEN is unset; canonical release remains available'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.NPM_AVAILABLE == 'true'
        with:
          persist-credentials: false
      - name: Pin package metadata, shim and README to the release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.NPM_AVAILABLE == 'true'
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
          path: .release-tag
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: env.NPM_AVAILABLE == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: env.NPM_AVAILABLE == 'true'
        with:
          node-version: '22.23.4'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: env.NPM_AVAILABLE == 'true'
        with:
          name: rust-canonical-${{ needs.plan.outputs.tag }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .canonical/
      - name: Stage normal and npm-only runs from verified published archives
        if: env.NPM_AVAILABLE == 'true'
        env:
          PACKAGE_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 scripts/rust-release-workflow.py verify-archives --directory .canonical --tag "$RELEASE_TAG" --source "$PACKAGE_SOURCE_SHA"
          echo "npm package inputs=$PACKAGE_SOURCE_SHA redistribution scripts=$GITHUB_SHA"
          cp scripts/{stage-npm-from-release.mjs,stage-npm-binaries.mjs,publish-npm.mjs,publish-npm.sh,sync-npm-version.mjs} .release-tag/scripts/
          cd .release-tag
          node scripts/stage-npm-from-release.mjs ../.canonical
          node scripts/sync-npm-version.mjs "$RELEASE_TAG"
      - name: Publish platform packages before root (npm credential only here)
        if: env.NPM_AVAILABLE == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: .release-tag
        run: bash scripts/publish-npm.sh "$RELEASE_TAG"

  pointers:
    needs: [plan, canonical]
    if: ${{ always() && needs.canonical.result == 'success' && (needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'homebrew' || needs.plan.outputs.mode == 'winget') }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        channel: [homebrew, winget]
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      MODE: ${{ needs.plan.outputs.mode }}
      CHANNEL: ${{ matrix.channel }}
      POINTER_AVAILABLE: ${{ secrets.PUBLISH_GITHUB_TOKEN != '' && 'true' || 'false' }}
      STABLE: ${{ needs.plan.outputs.prerelease == 'false' && 'true' || 'false' }}
    steps:
      - name: Report skipped optional or prerelease pointer
        if: env.POINTER_AVAILABLE != 'true' || env.STABLE != 'true' || (env.MODE != 'full' && env.MODE != env.CHANNEL)
        run: echo "::notice::$CHANNEL skipped (mode=$MODE, stable=$STABLE, credential configured=$POINTER_AVAILABLE)"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.POINTER_AVAILABLE == 'true' && env.STABLE == 'true' && (env.MODE == 'full' || env.MODE == env.CHANNEL)
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: env.POINTER_AVAILABLE == 'true' && env.STABLE == 'true' && (env.MODE == 'full' || env.MODE == env.CHANNEL)
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: env.POINTER_AVAILABLE == 'true' && env.STABLE == 'true' && (env.MODE == 'full' || env.MODE == env.CHANNEL)
        with:
          name: rust-canonical-${{ needs.plan.outputs.tag }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .canonical/
      - name: Prepare stable pointer manifests from canonical archives
        if: env.POINTER_AVAILABLE == 'true' && env.STABLE == 'true' && (env.MODE == 'full' || env.MODE == env.CHANNEL)
        run: >-
          python3 scripts/prepare-rust-release-channels.py --archives .canonical
          --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --output .pointer-inputs
      - name: Publish pointer (cross-repository PAT only here)
        if: env.POINTER_AVAILABLE == 'true' && env.STABLE == 'true' && (env.MODE == 'full' || env.MODE == env.CHANNEL)
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_GITHUB_TOKEN }}
        run: python3 scripts/rust-release-workflow.py publish-pointer --channel "$CHANNEL" --directory .pointer-inputs --tag "$RELEASE_TAG"
