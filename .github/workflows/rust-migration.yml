name: Rust migration candidate

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'web/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/rust-candidate-ci.py'
      - '.github/workflows/rust-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    env:
      RUSTUP_TOOLCHAIN: '1.90.0'
      GOTOOLCHAIN: local
      MANY_AI_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Preserve committed source bytes on every runner
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install pinned Rust (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Install pinned Rust (Windows PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Validate and build native candidates (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: python3 scripts/rust-candidate-ci.py --target '${{ matrix.target }}'
      - name: Validate and build native candidates (Windows PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/rust-candidate-ci.py --target '${{ matrix.target }}'
      - name: Retain unaccepted build receipts and both binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-candidate-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: .rust-candidate-artifacts/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
