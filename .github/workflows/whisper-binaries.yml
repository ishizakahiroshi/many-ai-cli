# whisper-server バイナリの自前ビルド（plan C3/C4・D3）
#
# 公式 ggml-org/whisper.cpp の release には Linux/macOS の whisper-server
# 実行ファイルが添付されていない（v1.8.6 時点）。managed install のダウンロード
# 経路で使うため、ここで各プラットフォーム向けに whisper-server をビルドし、
# tar.gz + SHA256 を生成する。
#
# 使い方:
#   1. Actions から手動実行（whisper_tag と、その tag が指す commit の
#      whisper_commit を指定。publish=true で release へ添付）
#   2. 出力された SHA256 を internal/hub/whisper_manage.go の whisperBinaries の
#      該当 os/arch エントリ（現在 TODO コメント）へ転記して有効化する
#
# build job は上流の CMake（任意のコマンドを実行できる）を動かすので、読み取り
# だけの token を .git/config に残さずに使い、tag が指す commit を照合してから
# ビルドする。release への書き込みは、上流のコードを取得も実行もしない publish
# job だけが行う（監査 U39）。
#
# 注意: Docker(リモートサーバー) 経路はこの資産を使わず、イメージにビルド同梱する
#       （deploy/docker/Dockerfile の whisper-build ステージ / D5-A）。tag と commit の
#       既定値は Dockerfile の WHISPER_CPP_TAG / WHISPER_CPP_COMMIT と揃える。
name: whisper-binaries

on:
  workflow_dispatch:
    inputs:
      whisper_tag:
        description: "whisper.cpp release tag to build (e.g. v1.8.6)"
        required: true
        default: "v1.8.6"
      whisper_commit:
        description: "Full commit SHA that whisper_tag must point to (the build stops otherwise)"
        required: true
        default: "23ee03506a91ac3d3f0071b40e66a430eebdfa1d"
      publish:
        description: "Upload tarballs to a GitHub release (whisper-<tag>)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-22.04
            cmake_flags: "-DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF"
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            cmake_flags: "-DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF"
          - name: darwin-arm64
            runner: macos-14
            cmake_flags: "-DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=1 -DGGML_OPENMP=OFF"
          - name: darwin-amd64
            runner: macos-13
            cmake_flags: "-DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF"
    steps:
      - name: Validate whisper_tag and whisper_commit inputs
        shell: bash
        env:
          WHISPER_TAG: ${{ inputs.whisper_tag }}
          WHISPER_COMMIT: ${{ inputs.whisper_commit }}
        run: |
          if [[ ! "$WHISPER_TAG" =~ ^v[0-9]+(\.[0-9]+)+(-[a-zA-Z0-9.]+)?$ ]]; then
            echo "::error title=invalid tag::whisper_tag '$WHISPER_TAG' is invalid. Expected format like 'v1.8.6'."
            exit 1
          fi
          if [[ ! "$WHISPER_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=invalid commit::whisper_commit must be the full 40-character lowercase commit SHA."
            exit 1
          fi

      - name: Install build deps (Linux)
        if: startsWith(matrix.runner, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake git

      # refs/tags/ so that a branch of the same name cannot stand in for the tag.
      - name: Checkout whisper.cpp ${{ inputs.whisper_tag }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ggml-org/whisper.cpp
          ref: refs/tags/${{ inputs.whisper_tag }}
          persist-credentials: false

      - name: Require the tag to point to whisper_commit
        shell: bash
        env:
          WHISPER_COMMIT: ${{ inputs.whisper_commit }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$WHISPER_COMMIT" ]; then
            echo "::error title=whisper.cpp commit mismatch::the tag points to $actual, not $WHISPER_COMMIT"
            exit 1
          fi

      - name: Build whisper-server
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_flags }} -DWHISPER_BUILD_TESTS=OFF
          cmake --build build --config Release -j --target whisper-server

      - name: Inspect runtime dependencies
        shell: bash
        run: |
          BIN=build/bin/whisper-server
          file "$BIN" || true
          if [ "$RUNNER_OS" = "macOS" ]; then otool -L "$BIN" || true; else ldd "$BIN" || true; fi

      - name: Package tarball + SHA256
        id: pkg
        shell: bash
        run: |
          NAME=whisper-server-${{ matrix.name }}
          mkdir -p "dist/$NAME"
          cp build/bin/whisper-server "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          cd dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            SHA=$(shasum -a 256 "$NAME.tar.gz" | awk '{print $1}')
          else
            SHA=$(sha256sum "$NAME.tar.gz" | awk '{print $1}')
          fi
          echo "$SHA  $NAME.tar.gz" | tee "$NAME.tar.gz.sha256"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.name }}: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whisper-server-${{ matrix.name }}
          path: dist/whisper-server-${{ matrix.name }}.tar.gz*

  # The only job with write access. It neither checks out nor runs upstream
  # code. Legs that succeeded are published even if another leg failed
  # (fail-fast is off), as before the jobs were split.
  publish:
    needs: build
    if: ${{ !cancelled() && inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: whisper-server-*
          path: dist
          merge-multiple: true

      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # workflow_dispatch 入力は env 経由で渡し、bash の構文解析に参加させない
          # （run ブロックへ ${{ }} を直接埋め込むのはスクリプトインジェクションの定石）。
          WHISPER_TAG: ${{ inputs.whisper_tag }}
          WHISPER_COMMIT: ${{ inputs.whisper_commit }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          cd dist
          tarballs=(whisper-server-*.tar.gz)
          if [ "${#tarballs[@]}" -eq 0 ]; then
            echo "::error title=nothing to publish::no build leg produced a tarball"
            exit 1
          fi
          for tarball in "${tarballs[@]}"; do
            sha256sum --check --strict "$tarball.sha256"
          done
          TAG="whisper-$WHISPER_TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
              --notes "whisper.cpp $WHISPER_TAG ($WHISPER_COMMIT) server binaries built by whisper-binaries.yml. Paste the SHA256 into whisperBinaries in internal/hub/whisper_manage.go."
          for tarball in "${tarballs[@]}"; do
            gh release upload "$TAG" "$tarball" "$tarball.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          done
